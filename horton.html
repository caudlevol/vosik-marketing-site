<title>Vosik + D.R. Horton</title>
<style>
  :root { --navy: #081B28; --rust: #AB4928; --ink: #24313a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", Arial, Helvetica, sans-serif;
    background: #FDFCFA;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .stage { max-width: 860px; width: 100%; text-align: center; }
  .fade { opacity: 0; transform: translateY(14px); animation: rise .9s ease forwards; }
  .d1 { animation-delay: .15s } .d2 { animation-delay: .55s } .d3 { animation-delay: .95s }
  .d4 { animation-delay: 1.35s } .d5 { animation-delay: 1.9s }
  @keyframes rise { to { opacity: 1; transform: none } }
  .logos { display: flex; align-items: center; justify-content: center; gap: 36px; flex-wrap: wrap; margin-bottom: 44px; }
  .logos img.vosik { height: 74px; }
  .logos img.drh { height: 104px; }
  .plus { font-size: 44px; color: var(--rust); font-weight: 700; }
  .rule { width: 72px; height: 3px; background: var(--rust); margin: 0 auto 28px; border-radius: 2px; }
  h1 { font-family: "Inter Display", "Inter", Arial, sans-serif; font-size: clamp(32px, 5vw, 50px); color: var(--navy); letter-spacing: -.5px; margin-bottom: 18px; font-weight: 700; }
  .line { font-size: clamp(18px, 2.6vw, 23px); color: var(--ink); margin-bottom: 30px; font-weight: 400; }
  .prep { font-size: 13px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; color: #7a8690; margin-bottom: 46px; }
  .prep b { color: var(--navy); font-weight: 700; }
  a.enter {
    display: inline-block; background: var(--rust); color: #fff; text-decoration: none;
    padding: 13px 34px; border-radius: 8px; font-size: 16px; font-weight: 600; letter-spacing: .5px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.enter:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(171,73,40,.35); }
  .foot { font-size: 11px; font-weight: 500; color: #9aa4ac; margin-top: 54px; letter-spacing: 1px; }
</style>
</head>
